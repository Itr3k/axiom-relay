# Smithery import descriptor -- https://smithery.ai/docs
#
# Axiom runs on Cloudflare Workers and is not deployed through Smithery's
# runtime, so this points at the existing endpoint rather than describing a
# build.
#
# The MCP endpoint is given on the canonical product host. The Workers origin
# serves the same runtime and remains valid, but a directory listing is a
# product identity, and product identity is axiom.elevatedai.io.
runtime: "remote"
remote:
  url: "https://axiom.elevatedai.io/mcp"
  transport: "streamable-http"

metadata:
  name: "Axiom by Elevated AI"
  description: "Two things an agent can do today. Buy x402-paid APIs without knowing the provider: describe a capability, and Axiom finds live providers, ranks them on price and reliability, and relays your own signed payment to the seller (3% capped at $0.50, waived when too small to settle). And route token swaps on Base non-custodially: Axiom compares execution routes on what you would actually receive, validates the calldata, and returns transactions your own wallet signs (15 bps, provider fees and gas disclosed separately). Axiom never holds funds, never holds keys, and never signs."
  homepage: "https://axiom.elevatedai.io"
  repository: "https://github.com/Itr3k/axiom-relay"
  license: "MIT"
  categories:
    - "payments"
    - "web3"
    - "api-discovery"
    - "agent-infrastructure"
  keywords:
    - "x402"
    - "agent-payments"
    - "agentic-commerce"
    - "micropayments"
    - "usdc"
    - "base"
    - "non-custodial"
    - "provider-discovery"
    - "smart-routing"
    - "paid-api"
    - "crypto-routing"
    - "swap-routing"

tools:
  - name: "quote_crypto_swap"
    description: "Route a token swap non-custodially on Base. Compares execution providers on what you would actually receive, validates the calldata, and returns transactions for your own wallet to sign."
  - name: "analyze_crypto_swap"
    description: "Compare execution providers and total cost for a prospective swap, with a recommendation. Returns no signable transaction."
  - name: "find_paid_resource"
    description: "Find x402 API providers for a described capability, ranked on price and reliability. Executes no payment."
  - name: "quote_paid_resource"
    description: "Quote a specific x402 resource URL: seller price, Axiom fee, and the requirements to sign."
  - name: "purchase_paid_resource"
    description: "Execute a quoted purchase using authorizations you signed with your own wallet."
  - name: "check_provider"
    description: "Check whether a specific x402 endpoint is live and what it currently charges."
