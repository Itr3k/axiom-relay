# Publishes the MCP server entry to the official registry.
#
# Authentication uses this repository's GitHub OIDC identity, which is what
# grants the io.github.Itr3k/* namespace. No token is stored anywhere.
#
# The registry's search matches server *names* only -- descriptions are not
# indexed -- so the published name deliberately carries the capability keywords
# an agent would actually search for.
name: Publish to MCP Registry

on:
  push:
    paths: ['server.json']
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      # The registry allows one server per remote URL, so a superseded name must
      # be released before the replacement can claim the same endpoint. This
      # mints its own registry JWT from the job's OIDC identity rather than
      # reaching into wherever the CLI caches one.
      - name: Release the superseded entry
        continue-on-error: true
        run: |
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://registry.modelcontextprotocol.io" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')
          curl -sS -X POST https://registry.modelcontextprotocol.io/v0.1/auth/github-oidc \
            -H 'content-type: application/json' \
            -d "$(python3 -c 'import json,sys;print(json.dumps({"oidc_token":sys.argv[1]}))' "$OIDC")" \
            > /tmp/exchange.json
          TOKEN=$(python3 -c 'import json;print(json.load(open("/tmp/exchange.json")).get("registry_token",""))' 2>/dev/null || true)
          [ -n "$TOKEN" ] || { echo "token exchange failed: $(python3 -c "import json;d=json.load(open(\"/tmp/exchange.json\"));print(d.get(\"detail\",\"unknown\"))")"; exit 1; }
          OLD=$(python3 -c "import urllib.parse;print(urllib.parse.quote('io.github.Itr3k/axiom-x402-payment-relay',safe=''))")
          echo "retire response:"
          curl -sS -X PATCH "https://registry.modelcontextprotocol.io/v0.1/servers/$OLD/status" \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"status":"deleted","statusMessage":"Superseded by io.github.Itr3k/axiom-x402-payment-crypto-router (same endpoint, adds crypto routing)."}'
          echo

      - name: Publish
        run: ./mcp-publisher publish
