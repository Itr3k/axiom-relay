# Publishes the MCP server entry to the official registry.
#
# Authentication uses this repository's GitHub OIDC identity, which is what
# grants the io.github.Itr3k/* namespace. No token is stored anywhere.
#
# The registry's search matches server *names* only -- descriptions are not
# indexed -- so the published name deliberately carries the capability keywords
# an agent would actually search for.
name: Publish to MCP Registry

on:
  push:
    paths: ['server.json']
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      # The registry allows one server per remote URL, so a superseded name must
      # be released before the replacement can claim the same endpoint.
      - name: Release the superseded entry
        continue-on-error: true
        run: |
          TOKEN=$(python3 - <<'PY'
          import json, pathlib
          raw = pathlib.Path.home().joinpath('.mcp_publisher_token').read_text().strip()
          try:
              print(json.loads(raw)['token'])
          except Exception:
              print(raw)
          PY
          )
          OLD=$(python3 -c "import urllib.parse;print(urllib.parse.quote('io.github.Itr3k/axiom-relay',safe=''))")
          curl -sS -X PATCH "https://registry.modelcontextprotocol.io/v0.1/servers/$OLD/status" \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"status":"deleted","statusMessage":"Superseded by io.github.Itr3k/axiom-x402-payment-relay (same endpoint, searchable name)."}'
          echo

      - name: Publish
        run: ./mcp-publisher publish
